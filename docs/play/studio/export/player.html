<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{NAME}}</title>
<!--
  {{NAME}}: a C64 game made in the breadbin Studio (https://github.com/jacobandresen/breadbin).
  This one file is the whole thing: the game (a C64 program), and breadbin's small C64 to run
  it on, compiled to WebAssembly (MIT licence, no Commodore ROM). Open it in any browser,
  online or not.
-->
<style>
  :root { --bg: #1c1c1c; --panel: #282828; --fg: #ebdbb2; --dim: #928374; --accent: #fabd2f; --line: #3c3836; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.4 ui-sans-serif, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.02em; }
  .screen { position: relative; width: min(100%, calc((100vh - 140px) * 384 / 272)); aspect-ratio: 384 / 272; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 16px 48px rgb(0 0 0 / 0.5); }
  canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
  .start { position: absolute; inset: 0; display: grid; place-items: center; background: rgb(0 0 0 / 0.55); border: 0; color: var(--fg); font: inherit; cursor: pointer; }
  .start b { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #1c1c1c; font-size: 17px; }
  .hint { color: var(--dim); font-size: 13px; text-align: center; }
  kbd { font: 12px ui-monospace, monospace; padding: 1px 6px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; color: var(--fg); background: var(--panel); }
  .pad { display: none; width: min(100%, 520px); justify-content: space-between; align-items: center; }
  .stick { position: relative; width: 150px; height: 150px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); }
  .knob { position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 50%; background: #cc241d; box-shadow: inset 0 -6px 0 rgb(0 0 0 / 0.3); transition: transform 60ms; }
  .fire { width: 96px; height: 96px; border-radius: 50%; border: 0; background: #cc241d; color: #fff; font: 700 16px ui-sans-serif, system-ui; box-shadow: inset 0 -8px 0 rgb(0 0 0 / 0.3); }
  .fire.on { transform: translateY(3px); box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.3); }
  @media (pointer: coarse) { .pad { display: flex; } .keys-hint { display: none; } .screen { width: min(100%, calc((100vh - 260px) * 384 / 272)); } }
  .ended { position: absolute; inset: auto 0 0 0; padding: 8px; text-align: center; background: rgb(0 0 0 / 0.6); color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<h1>{{NAME}}</h1>
<div class="screen">
  <canvas width="384" height="272"></canvas>
  <button class="start"><b>▶ Play</b></button>
</div>
<p class="hint keys-hint"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> move · <kbd>Space</kbd> fire · <kbd>Shift</kbd>+<kbd>F</kbd> full screen · <kbd>Shift</kbd>+<kbd>M</kbd> sound · a gamepad works too</p>
<div class="pad"><div class="stick"><div class="knob"></div></div><button class="fire">FIRE</button></div>
<script>
const BB = /*BB_DATA*/{};
const bytes = (b64) => Uint8Array.fromBase64(b64);
const UP = 1, DOWN = 2, LEFT = 4, RIGHT = 8, FIRE = 16;
const canvas = document.querySelector('canvas');
const ctx2d = canvas.getContext('2d');
const image = ctx2d.createImageData(384, 272);
const pixels = new Uint32Array(image.data.buffer);
let w, m, audio, nextTime = 0, muted = false;
let keysJoy = 0, padJoy = 0, touchJoy = 0;

// the C64's keyboard matrix: [column (CIA 1 port A bit), row (port B bit)] for the host's keys
const MATRIX = {
  Backspace: [0, 0], Enter: [0, 1], F7: [0, 3], F1: [0, 4], F3: [0, 5], F5: [0, 6],
  Digit3: [1, 0], KeyW: [1, 1], KeyA: [1, 2], Digit4: [1, 3], KeyZ: [1, 4], KeyS: [1, 5], KeyE: [1, 6], ShiftLeft: [1, 7],
  Digit5: [2, 0], KeyR: [2, 1], KeyD: [2, 2], Digit6: [2, 3], KeyC: [2, 4], KeyF: [2, 5], KeyT: [2, 6], KeyX: [2, 7],
  Digit7: [3, 0], KeyY: [3, 1], KeyG: [3, 2], Digit8: [3, 3], KeyB: [3, 4], KeyH: [3, 5], KeyU: [3, 6], KeyV: [3, 7],
  Digit9: [4, 0], KeyI: [4, 1], KeyJ: [4, 2], Digit0: [4, 3], KeyM: [4, 4], KeyK: [4, 5], KeyO: [4, 6], KeyN: [4, 7],
  Equal: [5, 0], KeyP: [5, 1], KeyL: [5, 2], Minus: [5, 3], Period: [5, 4], Semicolon: [5, 5], BracketLeft: [5, 6], Comma: [5, 7],
  Quote: [6, 2], ShiftRight: [6, 4], Slash: [6, 7],
  Digit1: [7, 0], ControlLeft: [7, 2], Digit2: [7, 3], Space: [7, 4], KeyQ: [7, 6], Escape: [7, 7],
};
const JOYKEYS = { ArrowUp: UP, ArrowDown: DOWN, ArrowLeft: LEFT, ArrowRight: RIGHT, Space: FIRE };
// keys typed, as PETSCII, for programs that read the keyboard through the KERNAL (cgetc, GETIN)
const NAMED = { Enter: 13, Backspace: 20, ArrowUp: 145, ArrowDown: 17, ArrowLeft: 157, ArrowRight: 29, Home: 19, Escape: 3 };
function petscii(e) {
  if (NAMED[e.key]) return NAMED[e.key];
  if (e.key.length !== 1 || e.ctrlKey || e.metaKey) return 0;
  const c = e.key.charCodeAt(0);
  if (c >= 97 && c <= 122) return c - 32; // a-z: the unshifted letters
  if (c >= 65 && c <= 90) return c + 128; // A-Z: shifted
  return c >= 32 && c < 96 ? c : 0;
}

function joy() {
  if (m) w.bb_machine_joy(m, 2, keysJoy | padJoy | touchJoy);
}

async function boot() {
  const wasm = await WebAssembly.instantiate(bytes(BB.wasm), { env: { host_peek: () => 0, host_poke() {}, host_event() {} } });
  w = wasm.instance.exports;
  const put = (b) => { const p = w.bb_alloc(b.length); new Uint8Array(w.memory.buffer, p, b.length).set(b); return [p, b.length]; };
  const rate = audio ? audio.sampleRate : 44100;
  m = w.bb_machine_new(...put(bytes(BB.prg)), ...put(bytes(BB.font)), rate);
  if (!m) throw new Error('the game would not start');
}

function frame() {
  const ptr = w.bb_machine_frame(m);
  pixels.set(new Uint32Array(w.memory.buffer, ptr, 384 * 272));
  // 0x00RRGGBB words to RGBA bytes
  for (let i = 0; i < pixels.length; i++) { const p = pixels[i]; pixels[i] = 0xff000000 | ((p & 0xff) << 16) | (p & 0xff00) | ((p >> 16) & 0xff); }
  const n = w.bb_out_len() >> 1;
  if (audio && n && !muted) {
    const s = new Int16Array(w.memory.buffer, w.bb_out_ptr(), n);
    const buf = audio.createBuffer(1, n, audio.sampleRate);
    const ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = s[i] / 32768;
    const src = audio.createBufferSource();
    src.buffer = buf;
    src.connect(audio.destination);
    const now = audio.currentTime;
    if (nextTime < now + 0.02 || nextTime > now + 0.3) nextTime = now + 0.06;
    src.start(nextTime);
    nextTime += n / audio.sampleRate;
  }
}

// 50 frames a second, as a PAL C64 (985248 / 19656 Hz), whatever the display's rate
const FRAME_MS = 1000 / (985248 / 19656);
let last = 0, owed = 0;
function loop(t) {
  owed = Math.min(owed + (last ? t - last : FRAME_MS), FRAME_MS * 5);
  last = t;
  pollPads();
  let ran = false;
  while (owed >= FRAME_MS) { frame(); owed -= FRAME_MS; ran = true; }
  if (ran) ctx2d.putImageData(image, 0, 0);
  if (w.bb_machine_ended(m) && !document.querySelector('.ended')) {
    document.querySelector('.screen').append(Object.assign(document.createElement('div'), { className: 'ended', textContent: 'The program has ended. Reload the page to play again.' }));
  }
  requestAnimationFrame(loop);
}

function pollPads() {
  let bits = 0;
  for (const p of navigator.getGamepads?.() || []) {
    if (!p) continue;
    const [x = 0, y = 0] = p.axes;
    const b = (i) => p.buttons[i]?.pressed;
    if (y < -0.5 || b(12)) bits |= UP;
    if (y > 0.5 || b(13)) bits |= DOWN;
    if (x < -0.5 || b(14)) bits |= LEFT;
    if (x > 0.5 || b(15)) bits |= RIGHT;
    if (b(0) || b(1) || b(2) || b(3)) bits |= FIRE;
  }
  if (bits !== padJoy) { padJoy = bits; joy(); }
}

function key(e, down) {
  if (JOYKEYS[e.code]) {
    keysJoy = down ? keysJoy | JOYKEYS[e.code] : keysJoy & ~JOYKEYS[e.code];
    joy();
  }
  const k = MATRIX[e.code];
  if (k && m) w.bb_machine_key(m, k[0], k[1], down ? 1 : 0);
  const p = down && m ? petscii(e) : 0;
  if (p) w.bb_machine_type(m, p);
  if (k || JOYKEYS[e.code]) e.preventDefault();
}
// letters and digits are the C64's keys; Shift+F and Shift+M are the page's
addEventListener('keydown', (e) => {
  if (e.shiftKey && e.code === 'KeyF') return void (document.fullscreenElement ? document.exitFullscreen() : document.querySelector('.screen').requestFullscreen?.());
  if (e.shiftKey && e.code === 'KeyM') return void (muted = !muted);
  key(e, true);
});
addEventListener('keyup', (e) => key(e, false));
addEventListener('blur', () => { keysJoy = 0; joy(); });

// the touch stick and FIRE
const stick = document.querySelector('.stick'), knob = document.querySelector('.knob'), fire = document.querySelector('.fire');
function steer(e) {
  const r = stick.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const d = Math.hypot(dx, dy), lim = r.width / 2 - 32;
  knob.style.transform = `translate(${(dx / Math.max(d, 1)) * Math.min(d, lim)}px, ${(dy / Math.max(d, 1)) * Math.min(d, lim)}px)`;
  let bits = 0;
  if (d > 18) {
    const a = Math.atan2(dy, dx) * 180 / Math.PI;
    if (a > -157.5 && a < -22.5) bits |= UP;
    if (a > 22.5 && a < 157.5) bits |= DOWN;
    if (a > 112.5 || a < -112.5) bits |= LEFT;
    if (a > -67.5 && a < 67.5) bits |= RIGHT;
  }
  touchJoy = (touchJoy & FIRE) | bits;
  joy();
}
stick.addEventListener('pointerdown', (e) => { stick.setPointerCapture(e.pointerId); steer(e); });
stick.addEventListener('pointermove', (e) => stick.hasPointerCapture(e.pointerId) && steer(e));
stick.addEventListener('pointerup', () => { knob.style.transform = ''; touchJoy &= FIRE; joy(); });
fire.addEventListener('pointerdown', () => { touchJoy |= FIRE; fire.classList.add('on'); joy(); });
fire.addEventListener('pointerup', () => { touchJoy &= ~FIRE; fire.classList.remove('on'); joy(); });

document.querySelector('.start').addEventListener('click', async (e) => {
  e.currentTarget.remove();
  try { audio = new AudioContext(); } catch {}
  try { await boot(); } catch (err) { document.querySelector('h1').textContent = `Couldn't start: ${err.message}`; return; }
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
