name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    name: Build .deb (Debian/Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential debhelper cargo pkg-config \
            libgtk-4-dev libadwaita-1-dev libglib2.0-dev libasound2-dev

      - name: Build package
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -us -uc -b

      - name: Collect artifact
        run: |
          mkdir -p dist
          mv ../breadbin_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: dist/*.deb

  update-aur:
    name: Update AUR package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check AUR deploy key is configured
        id: check
        run: |
          if [ -n "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AUR_SSH_PRIVATE_KEY secret not set — skipping AUR push."
          fi

      - name: Bump pkgver in PKGBUILD
        if: steps.check.outputs.configured == 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/arch/PKGBUILD

      - name: Install SSH key
        if: steps.check.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Push updated PKGBUILD to AUR
        if: steps.check.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

          git clone ssh://aur@aur.archlinux.org/breadbin.git aur-repo
          cp packaging/arch/PKGBUILD aur-repo/PKGBUILD
          cp packaging/arch/breadbin.install aur-repo/breadbin.install

          cd aur-repo
          docker run --rm -v "$PWD:/repo" -w /repo archlinux:base-devel \
            bash -c "pacman -Syu --noconfirm --needed base-devel git && useradd -m builder && chown -R builder:builder /repo && su builder -c 'makepkg --printsrcinfo > .SRCINFO'"

          git config user.name "Breadbin Release Bot"
          git config user.email "jacob.andresen@gmail.com"
          git add PKGBUILD breadbin.install .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to ${GITHUB_REF_NAME}"
            git push
          fi

  publish-release:
    name: Publish GitHub Release
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb-package
          path: dist

      - name: Create/update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
