name: Pages

# Publishes docs/ (the landing page and the browser version in docs/play) to
# GitHub Pages, with the Rust engine, the ACME assembler and the Studio's cc65
# built to WebAssembly on the way, and the Studio's tests run.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/**"
      - "Makefile"
      - "tools/studio/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the engine for the browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo test
          make web

      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 6.0.13

      - name: Build the assembler for the browser
        run: make acme

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the Studio (cc65 in WebAssembly, the code editor)
        run: make studio

      - name: Test the Studio
        run: make test-studio

      # The Studio in Chrome, and its games on vc64web (on the internet): reported,
      # but a hiccup out there doesn't hold up the deploy.
      - name: Test the Studio in a browser
        continue-on-error: true
        run: CHROME=/usr/bin/google-chrome FIREFOX=none make test-studio-browser

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
