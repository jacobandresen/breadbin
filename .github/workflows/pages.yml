name: Pages

# Publishes docs/ (the landing page and the browser version in docs/play) to
# GitHub Pages, with the SID player built to WebAssembly on the way.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "crates/breadbin-sid/**"
      - "crates/breadbin-sid-wasm/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the SID player for the browser
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release -p breadbin-sid-wasm --target wasm32-unknown-unknown
          cp target/wasm32-unknown-unknown/release/breadbin_sid_wasm.wasm docs/play/sid.wasm

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
